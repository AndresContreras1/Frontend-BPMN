name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Compilar, probar y analizar
    runs-on: ubuntu-latest
    # A nivel de job: los secretos no se pueden leer en un "if"
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar necesita el historial completo para distinguir el codigo nuevo
          fetch-depth: 0

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npm run test:ci

      - name: Compilar en modo producción
        run: npx ng build --configuration production

      - name: Analisis SonarCloud
        # Se omite hasta que exista el secreto SONAR_TOKEN en el repositorio
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t frontend-bpmn:ci .
