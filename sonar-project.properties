# Análisis de SonarCloud (lo corre el CI cuando el repositorio tiene el secreto SONAR_TOKEN)
sonar.organization=andrescontreras1
sonar.projectKey=AndresContreras1_Frontend-BPMN
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=**/*.spec.ts,src/environments/**
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Cobertura de las pruebas unitarias (npm run test:ci)
sonar.javascript.lcov.reportPaths=coverage/frontend-bpmn/lcov.info
