server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La API vive en el contenedor del backend: el navegador ve un solo origen, sin CORS.
    # ^~ evita que la regla de archivos estáticos (más abajo) capture rutas de la API.
    # $http_host conserva el puerto (localhost:8080): el backend arma con él las URL que devuelve (Swagger)
    location ^~ /api/ {
        proxy_pass http://backend:8090;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
    }

    # Documentación de la API (Swagger UI y OpenAPI) a través del mismo origen
    location ^~ /swagger-ui {
        proxy_pass http://backend:8090;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
    }
    location ^~ /v3/api-docs {
        proxy_pass http://backend:8090;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
    }

    # SPA: cualquier ruta de Angular se resuelve con index.html (recargar /procesos/5 no da 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash pueden guardarse en caché; index.html no
    location ~* \.(js|css|woff2?|ico|svg|png)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
