server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La API vive en el contenedor del backend: el navegador ve un solo origen, sin CORS
    location /api/ {
        proxy_pass http://backend:8090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta de Angular se resuelve con index.html (recargar /procesos/5 no da 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash pueden guardarse en caché; index.html no
    location ~* \.(js|css|woff2?|ico|svg|png)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
