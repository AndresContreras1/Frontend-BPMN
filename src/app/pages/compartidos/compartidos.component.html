<app-page-title titulo="Compartidos conmigo" hu="HU-23" subtitulo="Procesos de otras empresas que puede consultar en solo lectura"></app-page-title>
<app-alerta-error [problema]="problema()" (cerrar)="problema.set(null)"></app-alerta-error>

<app-tabla-generica [columnas]="columnas" [orden]="orden()" (ordenar)="ordenar($event)"
                    [cargando]="cargando() && !resultado()" [vacia]="resultado()?.content?.length === 0"
                    mensajeVacio="Ninguna empresa ha compartido procesos con la suya.">
  @for (c of resultado()?.content ?? []; track c.proceso.id) {
    <tr class="fila-compartido">
      <td><a [routerLink]="['/procesos', c.proceso.id]" class="fw-semibold text-decoration-none nombre-proceso">{{ c.proceso.nombre }}</a></td>
      <td><i class="bi bi-building text-body-secondary"></i> {{ c.empresaPropietaria }}</td>
      <td>{{ c.proceso.categoria }}</td>
      <td><app-estado-badge [estado]="c.proceso.estado"></app-estado-badge></td>
      <td class="small">{{ c.proceso.modificadoEn | date: 'short' }}</td>
    </tr>
  }
</app-tabla-generica>

<app-paginador [page]="page()" [totalPages]="resultado()?.totalPages ?? 0"
               [totalElements]="resultado()?.totalElements ?? 0" (pageChange)="page.set($event)"></app-paginador>
