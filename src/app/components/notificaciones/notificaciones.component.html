<div class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite" aria-atomic="true">
  @for (n of notificaciones.avisos(); track n.id) {
    <div class="toast show align-items-center border-0 aparecer notificacion" role="status"
         [class.text-bg-success]="n.tipo === 'exito'" [class.text-bg-danger]="n.tipo === 'error'"
         [class.text-bg-primary]="n.tipo === 'info'">
      <div class="d-flex">
        <div class="toast-body">
          <i class="bi me-2" [class.bi-check-circle-fill]="n.tipo === 'exito'"
             [class.bi-exclamation-octagon-fill]="n.tipo === 'error'" [class.bi-info-circle-fill]="n.tipo === 'info'"></i>
          {{ n.mensaje }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Cerrar aviso"
                (click)="notificaciones.cerrar(n.id)"></button>
      </div>
    </div>
  }
</div>
