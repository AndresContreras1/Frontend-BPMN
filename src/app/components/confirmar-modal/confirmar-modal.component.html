@if (abierto()) {
  <div class="modal-backdrop fade show"></div>
  <div class="modal fade show d-block" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5">{{ titulo() }}</h2>
          <button type="button" class="btn-close" aria-label="Cancelar" (click)="cancelar.emit()"></button>
        </div>
        <div class="modal-body">
          <p class="mb-2">{{ mensaje() }}</p>
          @if (advertencias().length) {
            <div class="alert alert-warning mb-0">
              <strong>Al eliminar quedará:</strong>
              <ul class="mb-0">
                @for (a of advertencias(); track $index) {
                  <li>{{ a.mensaje }}</li>
                }
              </ul>
            </div>
          }
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="cancelar.emit()">Cancelar</button>
          <button type="button" class="btn btn-danger" id="confirmarEliminarBtn" (click)="confirmar.emit()">
            {{ textoConfirmar() }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
