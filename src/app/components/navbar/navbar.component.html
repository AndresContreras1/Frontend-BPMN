      <i class="bi bi-diagram-3-fill text-primary"></i> Editor BPMN
    </a>
    @if (usuario(); as u) {
      <button class="navbar-toggler" type="button" (click)="menuAbierto = !menuAbierto"

        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" [class.show]="menuAbierto">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" routerLink="/procesos" routerLinkActive="active" (click)="menuAbierto = false">Procesos</a></li>

        <div class="d-flex align-items-center gap-3">
          <span class="small text-end">
            <strong>{{ u.nombre }}</strong> · {{ u.empresaNombre }}<br>
            <span class="badge text-bg-primary">{{ u.rol }}</span>
          </span>
          <button class="btn btn-outline-secondary btn-sm" type="button" id="cerrarSesionBtn" (click)="cerrarSesion.emit()">
