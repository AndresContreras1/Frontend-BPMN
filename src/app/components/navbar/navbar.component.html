<header class="sticky-top">
  <nav class="navbar navbar-expand-xl navbar-dark fondo-marca shadow-sm" aria-label="Menú principal">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" [routerLink]="usuario() ? '/inicio' : '/'" id="marcaNavbar">
        <i class="bi bi-diagram-3-fill"></i> Editor BPMN
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
              aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        @if (usuario(); as u) {
          <ul class="navbar-nav me-auto mb-2 mb-xl-0">
            @for (enlace of enlaces; track enlace.ruta) {
              <li class="nav-item">
                <a class="nav-link text-nowrap" [routerLink]="enlace.ruta" routerLinkActive="active" [id]="enlace.id">
                  <i class="bi me-1" [class]="enlace.icono"></i>{{ enlace.texto }}
                </a>
              </li>
            }
          </ul>
          <div class="dropdown">
            <button class="btn btn-link nav-link dropdown-toggle d-flex align-items-center gap-2 text-white text-decoration-none px-0"
                    type="button" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false" id="menuUsuarioBtn">
              <span class="avatar" aria-hidden="true">{{ iniciales() }}</span>
              <span class="text-start lh-sm">
                <strong class="d-block" id="usuarioNombre">{{ u.nombre }}</strong>
                <small class="opacity-75">{{ u.empresaNombre }}</small>
              </span>
            </button>
            <ul class="dropdown-menu dropdown-menu-xl-end shadow" aria-labelledby="menuUsuarioBtn">
              <li class="px-3 py-2 small">
                <div class="text-body-secondary">{{ u.correo }}</div>
                <span class="badge text-bg-primary mt-1" id="usuarioRol">{{ u.rol }}</span>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <a class="dropdown-item" routerLink="/empresa" id="navMiEmpresa"><i class="bi bi-building me-2"></i>Mi empresa</a>
              </li>
              <li>
                <button class="dropdown-item text-danger" type="button" id="cerrarSesionBtn" (click)="cerrarSesion.emit()">
                  <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                </button>
              </li>
            </ul>
          </div>
        } @else {
          <ul class="navbar-nav ms-auto align-items-xl-center gap-xl-2">
            <li class="nav-item"><a class="nav-link" routerLink="/login" routerLinkActive="active" id="navLogin">Iniciar sesión</a></li>
            <li class="nav-item">
              <a class="btn btn-light btn-sm" routerLink="/registro" id="navRegistro">Registrar empresa</a>
            </li>
          </ul>
        }
      </div>
    </div>
  </nav>
</header>
