@if (totalPaginas() > 1) {
  <nav aria-label="Paginación" class="d-flex justify-content-between align-items-center mt-3">
    <small class="text-body-secondary">{{ totalElementos() }} resultados · página {{ pagina() + 1 }} de {{ totalPaginas() }}</small>
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item" [class.disabled]="pagina() === 0">
        <button class="page-link" type="button" (click)="ir(pagina() - 1)" [disabled]="pagina() === 0">Anterior</button>
      </li>
      @for (numero of paginas(); track numero) {
        <li class="page-item" [class.active]="numero === pagina()">
          <button class="page-link" type="button" (click)="ir(numero)">{{ numero + 1 }}</button>
        </li>
      }
      <li class="page-item" [class.disabled]="pagina() >= totalPaginas() - 1">
        <button class="page-link" type="button" (click)="ir(pagina() + 1)" [disabled]="pagina() >= totalPaginas() - 1">Siguiente</button>
      </li>
    </ul>
  </nav>
} @else if (totalElementos() > 0) {
  <small class="text-body-secondary d-block mt-3">{{ totalElementos() }} resultados</small>
}
