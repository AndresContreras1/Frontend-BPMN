<!-- Grupo SVG del arco; "seleccionado" y "con-error" cambian su color desde el CSS; data-arco ayuda a las pruebas -->
<svg:g class="arco" [class.seleccionado]="seleccionado()" [class.con-error]="conError()" [attr.data-arco]="arco().id" (click)="alClic($event)">
  <!-- Texto que aparece al pasar el mouse: la condición si la tiene -->
  <svg:title>{{ arco().condicion ? 'Condición: ' + arco().condicion : 'Flujo de secuencia' }}</svg:title>
  <!-- Línea ancha e invisible: facilita hacer clic sobre el arco -->
  <svg:path class="zona-clic" [attr.d]="ruta().d" />
  <!-- Línea visible; marker-end le pone la punta de flecha definida en el lienzo -->
  <svg:path class="linea" [attr.d]="ruta().d" marker-end="url(#flecha-secuencia)" />
  <!-- Etiqueta (Sí / No) junto a la línea, si el arco tiene una -->
  @if (arco().etiqueta) {
    <svg:text class="etiqueta" [attr.x]="ruta().etiquetaX" [attr.y]="ruta().etiquetaY">{{ arco().etiqueta }}</svg:text>
  }
</svg:g>
